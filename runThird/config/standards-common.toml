#Which command families exist at all. Turning one off unregisters its
#commands entirely rather than refusing them, so tab-complete stays honest.
#Changing these needs a server restart.
[commands]
	fly = true
	god = true
	top = true
	jump = true
	back = true
	homes = true
	warps = true
	#/tpa, /tpahere, /tpaccept, /tpdeny, /tpacancel and /tptoggle.
	tpa = true
	#/vanish and /v. Also exposed to other mods via the PlayerSwitches API.
	vanish = true
	#A vanished player takes no damage.
	#On by default because 'not there' is the whole idea: hidden staff should
	#not be shot by someone spraying arrows at a rough guess, and should not
	#drown in a wall they walked into while watching a griefer. Turn it off
	#if you want vanish to hide you without also protecting you.
	vanishInvulnerable = true
	#Whether a vanished player picks items up. Off.
	#Named for the behaviour rather than its negation, so 'false' reads the
	#same way whichever end you approach it from.
	#Two reasons, and the first is the one that matters: an item vanishing off
	#the floor with nobody standing there gives you away as surely as being
	#seen. Unlike opening a chest, which stays deliberately visible, picking up
	#is not something you chose to do — you walked past it.
	#The second is that hidden staff watching a fight should not quietly
	#collect the loot. Turn it on if vanish is meant to be a free camera that
	#can still tidy up.
	vanishPickup = false
	#/smite — lightning on a target or wherever you are looking. Op-gated.
	smite = true
	#/spawn, /setspawn and /playerspawn.
	spawn = true
	#/heal, /feed and /rest.
	selfCare = true
	#/speed — a multiplier of vanilla's own walking and flying speeds.
	speed = true
	#/bottom — down to the lowest place it is safe to stand. Op-only by
	#default, since near bedrock it doubles as a crude ore finder.
	bottom = true
	#/gc, /tps, /lag, /mem — tick rate, memory, uptime and entity counts.
	serverHealth = true
	#/kit, /kits, /setkit, /delkit and /showkit. Kits are defined in game by
	#equipping yourself and saving, not by writing item ids into a file.
	kits = true
	#/mail — the counterpart to /msg, for when they are not online.
	mail = true
	#/tpoffline — to where a player logged out. Op-only.
	tpOffline = true
	#/afk and /lurk, plus the automatic idle detection that makes them
	#worth having.
	afk = true
	#/msg and its aliases, /r, /ignore, /msgtoggle and /socialspy.
	#Vanilla has /msg but no /r, which is the half people actually use.
	messaging = true
	#/tempban, /mute, /unmute and /invsee — the three gaps vanilla and
	#LuckPerms leave. Standards deliberately goes no further than this.
	moderation = true
	#Portable workstations: /craft, /anvil, /grindstone, /enderchest,
	#/trashcan. Registered but denied to everyone by default — grant the
	#standards.<name> node to a rank, or drive them from another mod through
	#the Stations API.
	stations = true
	#The built-in economy: /balance, /pay, /eco and the economy API.
	#Off also stops Standards registering itself as an economy provider,
	#which is what you want if a dedicated economy mod is installed.
	economy = true

#Teleporting: every command that moves a player goes through these.
[teleport]
	#Seconds a player must stand still before a queued teleport fires.
	#0 teleports immediately. Bypassed by standards.teleport.instant.
	# Default: 0
	# Range: 0 ~ 300
	warmupSeconds = 0
	#Moving during the warmup cancels the teleport.
	cancelOnMove = true
	#Taking damage during the warmup cancels the teleport — the anti-combat-log
	#half of a warmup, and the reason a warmup is worth having at all.
	cancelOnDamage = true
	#Seconds between teleports. Bypassed by standards.teleport.nocooldown.
	# Default: 0
	# Range: 0 ~ 86400
	cooldownSeconds = 0
	#Seconds a /tpa request stays open before it lapses. Both ends are told
	#when it does — a request that vanishes silently reads as a bug.
	# Default: 120
	# Range: 5 ~ 3600
	tpaTimeoutSeconds = 120
	#Where an accepted /tpa actually lands you, when a warmup is configured.
	#true  - wherever they are when the countdown ends. 'Teleport to the
	#        player' taken literally; you end up next to them even if they
	#        kept walking, in whichever dimension they are in by then.
	#false - where they were standing when they accepted. Predictable, and
	#        immune to being walked somewhere unpleasant during the count.
	#Either way the safe-landing search still applies, so neither setting
	#can drop you into lava.
	tpaFollowTarget = true
	#How many previous locations /back remembers. 1 is the classic behaviour;
	#more lets '/back 2' walk further up the trail.
	# Default: 5
	# Range: 1 ~ 50
	backHistory = 5
	#Record the death site so /back returns to it. Needs
	#standards.back.ondeath, which is NOT granted by default — returning to
	#your corpse is a real gameplay decision, not a convenience.
	backOnDeath = true
	#How many blocks up/down to search for a safe landing spot before giving
	#up. 0 disables the safety check entirely (arrive exactly where asked).
	# Default: 16
	# Range: 0 ~ 64
	safeSearchRange = 16

#Movement.
[movement]
	#Blocks /top refuses to scan past. A bedrock or barrier box around a
	#build is deliberate protection, and a /top that steps through the roof
	#of one is a way into somebody's base — so the scan stops at these and
	#says so, rather than landing you on top of the box.
	#Block ids. Unknown ids are ignored, so this may safely name blocks from
	#a mod that is not installed. Empty the list to scan through anything.
	topBarriers = ["minecraft:bedrock", "minecraft:barrier"]
	#Ceiling for /speed, as a multiple of normal. Above roughly 10 the
	#client's movement prediction stops agreeing with the server and players
	#rubber-band, so the default is deliberately below where it gets silly.
	# Default: 10.0
	# Range: 1.0 ~ 100.0
	maxSpeedMultiplier = 10.0

#Away from keyboard.
[afk]
	#Idle seconds before a player is marked away automatically. 0 leaves
	#/afk as a purely manual marker — which in practice means one nobody sets.
	# Default: 300
	# Range: 0 ~ 86400
	awayAfterSeconds = 300
	#Idle seconds before a player is disconnected. 0 never kicks, which is
	#the default: kicking idle players is a decision about your server's
	#player slots, not something a utility mod should assume.
	#standards.afk.exempt bypasses it.
	# Default: 0
	# Range: 0 ~ 86400
	kickAfterSeconds = 0
	#Announce going away and coming back to everyone.
	announce = true

#Mail.
[mail]
	#Letters one mailbox can hold. A cap is not optional: an uncapped
	#mailbox is a griefing tool and a save file that grows forever.
	# Default: 50
	# Range: 1 ~ 1000
	mailboxLimit = 50

#Chat name decoration. Other mods contribute prefixes and suffixes
#through the NameDecorator API — a faction tag, a party tag, a rank from
#LegendQuest — and this decides how they are assembled.
[chat]
	#The whole line. {prefixes} {name} {suffixes} {message} are filled in;
	#'&' colour codes work. The default reproduces vanilla's shape, so a
	#server with no decorators installed sees no change at all.
	#Example result: [FACTION][PARTY] Lord Sablednah the noble: hello
	format = "{prefixes}{name}{suffixes}&f: {message}"
	#Between two prefixes or two suffixes. Blank butts them together,
	#which is usually what you want for bracketed tags.
	affixSeparator = ""
	#Apply the format even when no decorator has anything to add. Off means
	#an undecorated line is left entirely alone, keeping vanilla's hover cards
	#and team colours — which is why off is the default.
	alwaysFormat = false

#Homes.
[homes]
	#Homes a player may set with no permissions manager installed, or with no
	#standards.home.limit.<n> node granted. -1 is unlimited.
	# Default: 3
	# Range: -1 ~ 10000
	defaultLimit = 3
	#The highest standards.home.limit.<n> node registered, since permission
	#nodes must be enumerated up front rather than parsed from what is granted.
	#Raise it if you want to grant a bigger number than this.
	# Default: 32
	# Range: 1 ~ 1000
	maxLimitNode = 32

#The built-in economy. Standards is a fallback, not a land grab: if another
#mod registers an economy provider it wins, and these settings then only
#describe how money is printed.
[economy]
	#What a brand-new account holds.
	# Default: 100.0
	# Range: 0.0 ~ 1.0E12
	startingBalance = 100.0
	#Used when no symbol is set: '1 credit', '25 credits'.
	currencyNameSingular = "credit"
	currencyNamePlural = "credits"
	#Shown instead of the currency name. Blank falls back to the name, so
	#clearing this gives '25 credits' rather than '₡25'.
	currencySymbol = "₡"
	#true gives '₡25', false gives '25₡'. Ignored when the symbol is blank.
	currencySymbolBefore = true
	#Decimal places shown, and the precision balances are rounded to.
	#0 makes the currency whole-number only, which is the default because it
	#is what nearly every server actually wants — fractional pennies only ever
	#show up in rounding complaints.
	# Default: 0
	# Range: 0 ~ 6
	decimals = 0
	#Let balances go below zero (debt). Off refuses the withdrawal instead.
	allowNegative = false
	#Exactly one ledger holds the money — two that disagree about your balance
	#is worse than either alone — and by default Standards yields to any
	#dedicated economy mod that registers itself. Turn this on to insist on
	#Standards' own ledger instead, which is what you want when a modpack
	#drags in an economy mod you did not ask for. Needs a restart: the choice
	#is settled during mod construction, before any command can run.
	preferOwnLedger = false
	#How many accounts /baltop lists.
	# Default: 10
	# Range: 1 ~ 100
	baltopSize = 10
