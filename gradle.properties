# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled for now; some ModDevGradle run tasks interact poorly with it.
org.gradle.configuration-cache=false

# Parchment provides human-readable parameter names/javadocs. Optional.
# Leave blank to disable if no Parchment mappings are published for this MC version yet.
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=
parchment_mappings_version=

# Environment Properties
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
# The Neo version must agree with the Minecraft version to get a valid artifact.
neo_version=26.2.0.72
# The NeoForge floor the published jar declares, kept SEPARATE from the build.
# Building against a newer NeoForge is routine - matching a test client, picking up a
# fix - and it must not quietly narrow who can install the result. Left unset, the
# floor tracks whatever was last built against, so bumping neo_version to match one
# machine locks everyone below it out of a mod that would have run fine.
neo_version_min=26.2.0.59
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

## Mod Properties
mod_id=standards
# The full name, because the mods list is the one place a bare 'Standards' is genuinely
# ambiguous. The mod id stays 'standards' — it is what admins type in permission nodes
# and what everyone calls it.
mod_name=SableCraft Standards
mod_license=MIT
mod_version=1.1.1
mod_group_id=com.sablednah.standards
mod_authors=Sablednah
mod_description=Do you have Standards? Server essentials done properly: fly, god, homes, warps, teleports, kits and a built-in economy, with explicit on/off states on every toggle and an economy API other mods can drive.

## Dev server
# Its own port so it cannot collide with a CityWorld (25565) or ZombieMod (25567) dev server.
# A port per Minecraft line, so a 1.21.11 server and this one can run side by side. Sharing one
# fails with "Address already in use" -> "Failed to initialize server" -> a crash report, which
# reads like a code fault and is not one.
dev_server_port=25572
