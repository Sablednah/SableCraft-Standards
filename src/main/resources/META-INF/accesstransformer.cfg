# Standards' access transformers.
#
# ⚠ THE FIRST AND ONLY ONE, AND IT SHOULD STAY THAT WAY. An access transformer is a
# version-fragile surface in the same family as this mod's single mixin: it names a vanilla
# member, and a Minecraft release that renames or removes it breaks the build. Adding a second
# needs the justification a second mixin would.
#
# WHY THIS ONE
#
# A Standards panel slides out to the left of the inventory and the inventory moves right to make
# room — what vanilla's recipe book does, and therefore what a player already expects. That means
# writing AbstractContainerScreen.leftPos, which is protected with no setter.
#
# The alternative was reflection, which is what LegendQuest does today:
#
#     LEFT_POS = AbstractContainerScreen.class.getDeclaredField("leftPos");
#     ...
#     throw new IllegalStateException("LegendQuest: inventory screen internals moved", e);
#
# Same fragility, worse failure. Reflection finds out at RUNTIME, in front of a player, as an
# exception on the inventory screen. An access transformer finds out at BUILD time, on the machine
# of whoever is doing the port, with the field named in the error. The field has to be written
# either way; being told early is the whole of the difference.
#
# ⚠ The first build after this file changes re-runs the neoform runtime and takes 10+ minutes.
# It is working, not hung.
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen leftPos
