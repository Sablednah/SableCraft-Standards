plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// The jar carries its Minecraft version: standards-0.1.0+mc1.21.11.jar. Standards is meant to
// live on several Minecraft lines at once (see CROSS-VERSION.md), and two files both called
// standards-0.1.0.jar are indistinguishable in a mods folder or on a releases page. The version
// INSIDE neoforge.mods.toml stays a plain ${mod_version} — the template reads the property, not
// this, so the loader never sees the suffix. (Lesson borrowed from CityWorld's 26.1 port.)
// The Windows-side dev clients build into their OWN directory.
//
// Without this they share build/ with the WSL-side dev server, which holds
// build/moddev/artifacts/neoforge-*.jar open on its classpath — and Windows cannot delete a file
// another process has open, so the client's :createMinecraftArtifacts fails with
// "Unable to delete file ...neoforge-21.11.42.jar". One directory per client, because the two
// clients run at the same time and would otherwise collide with each other instead.
//
// The expensive part (NeoForm decompiling Minecraft) lives in ~/.gradle and is still shared, so
// this costs disk, not time.  Used by TestClient.cmd; see there.
if (project.hasProperty('winClient')) {
    layout.buildDirectory = layout.projectDirectory.dir("build-win-${project.winClient}")
}

version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add additional repositories here if required by dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    // Parchment gives human-readable parameter names/javadocs. Optional.
    // Enabled only when both properties are set in gradle.properties (some MC
    // versions may not have Parchment mappings published yet).
    if (project.parchment_minecraft_version?.trim() && project.parchment_mappings_version?.trim()) {
        parchment {
            minecraftVersion = project.parchment_minecraft_version
            mappingsVersion = project.parchment_mappings_version
        }
    }

    // Access Transformers are auto-detected from META-INF/accesstransformer.cfg

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // A second pair of hands: 'runClientBuddy' opens a dev client named TestBuddy so
        // /tpa, /pay, /msg and the rest can be exercised between two players against the
        // dev server — no second account needed (dev server is online-mode=false).
        clientBuddy {
            client()
            programArguments.addAll '--username', 'TestBuddy',
                    '--quickPlayMultiplayer', "127.0.0.1:${project.dev_server_port}".toString()
            // Own game dir: sharing run/ with a live dev server means both fight over
            // logs/latest.log on drvfs.
            gameDirectory = file('runBuddy')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // A THIRD pair of hands. Two players cannot test /socialspy at all: every private
        // message between them is one the spy is already a party to, so there is no way to tell
        // spying from simply being talked to. The same is true of anything where a bystander
        // must NOT see something — ignores between two other people, party chat, a faction
        // channel. One more client makes those observable rather than argued about.
        clientThird {
            client()
            programArguments.addAll '--username', 'TestThird',
                    '--quickPlayMultiplayer', "127.0.0.1:${project.dev_server_port}".toString()
            gameDirectory = file('runThird')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Your own dev client, for two-player testing against the dev server. Separate from
        // 'client' because that one uses run/ as its game directory — which the dev server is
        // already using, and the two then fight over logs/latest.log on drvfs.
        //
        // Why not just join from your real CurseForge instance? Because that instance carries
        // LegendQuest, ZombieMod, CityWorld and the FTB mods, and NeoForge refuses a connection
        // when the required-mod lists disagree — "bad network protocol". A dev client matches the
        // dev server exactly.
        clientMain {
            client()
            programArguments.addAll '--username', 'Sablednah',
                    '--quickPlayMultiplayer', "127.0.0.1:${project.dev_server_port}".toString()
            gameDirectory = file('runMain')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            // Kill the previous runServer before starting another, or this binds and fails
            // with "Address already in use" — which reads like a code fault and is not one.
            programArguments.addAll '--port', project.dev_server_port
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // ./gradlew runServer -Pselftest  — runs SelfTest on ServerStartedEvent and logs a
            // pass/fail block. Passing -D on the gradlew command line sets it on Gradle's own JVM,
            // not the forked server, which looks like the test silently not running.
            if (project.hasProperty('selftest')) {
                systemProperty 'standards.selftest', 'true'
            }
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        // The dev server loads Factions too. Testing a faction mod without the mod it hard-depends
        // on would prove nothing, and a second dev server for it would need Standards installed
        // anyway — so there is one server, and it has both.
        factions {
            sourceSet(project(':factions').sourceSets.main)
        }
    }
}

// 'localRuntime' declares runtime-only test dependencies that are NOT published.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Factions on the RUNTIME classpath only. Not a compile dependency, and deliberately not:
    // Standards must never know Factions exists. The arrow points the other way, through the
    // groups and claims seams.
    localRuntime project(':factions')

    // SnakeYAML powers messages.yml — the owner-editable string catalogue. Minecraft does not
    // ship it, so it is embedded in the mod jar (jar-in-jar).
    implementation 'org.yaml:snakeyaml:2.2'
    jarJar('org.yaml:snakeyaml') {
        version {
            strictly '[2.2,3.0)'
            prefer '2.2'
        }
    }
}

// Expand mod metadata properties into the generated neoforge.mods.toml.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_min        : (project.findProperty('neo_version_min') ?: neo_version),
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Name the deprecated call rather than just noting one exists: a "uses a deprecated API"
    // note with no location is a warning nobody can act on.
    options.compilerArgs << '-Xlint:deprecation'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
